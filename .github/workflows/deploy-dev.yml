name: Deploy to Dev

on:
  push:
    branches: [ develop ]

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        service: [nv-ingest, nv-dedup, nv-correlation, nv-indexer, nv-group-indexer, nv-case-engine, nv-workflow, nv-query, nv-ui, nv-artifact-service, nv-socket-service, nv-node-service, nv-mcp-server]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare common code
        if: ${{ matrix.service != 'nv-ui' }}
        run: cp -r nv-core/common nv-core/${{ matrix.service }}/

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service == 'nv-ui' && './nv-ui' || format('./nv-core/{0}', matrix.service) }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:dev
