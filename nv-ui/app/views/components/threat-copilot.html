<!-- Threat Copilot — wrapper shares ng-controller scope between FAB & panel -->
<div ng-controller="nvThreatCopilotCtrl as copilot">

<!-- Floating Action Button -->
<button class="nv-copilot-fab" ng-click="copilot.toggle()" ng-class="{'is-open': copilot.visible}" title="Open AI Threat Copilot">
    <div class="fab-content">
        <div ng-if="!copilot.visible" class="dragon-container">
            <img src="images/cyber_dragon_icon.png" class="dragon-img" alt="Dragon">
        </div>
        <i ng-if="copilot.visible" class="fa fa-times"></i>
    </div>
</button>

<style>
.nv-copilot-fab {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    /* Premium tech gradient */
    background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
    color: white;
    font-size: 26px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    cursor: pointer;
    z-index: 10000;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.nv-copilot-fab:before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
    top: 0;
    left: 0;
    opacity: 0;
    transition: opacity 0.3s;
}
.nv-copilot-fab:hover:before {
    opacity: 1;
}
.nv-copilot-fab:hover {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
}
.nv-copilot-fab.is-open {
    background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    transform: rotate(180deg);
}
.nv-copilot-fab .fab-content {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 2;
}
.dragon-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: transparent;
}
.dragon-img {
    width: 90%; /* Scale back to normal fit */
    height: 90%;
    object-fit: contain;
    /* mix-blend-mode: screen makes black background transparent and intensifies glow */
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4));
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.nv-copilot-fab:hover .dragon-img {
    transform: scale(1.15) rotate(-10deg);
}
.nv-copilot-fab.is-open i {
    font-size: 24px;
}

/* Pulse animation for AI activity */
@keyframes ai-pulse {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.nv-copilot-fab:not(.is-open) {
    animation: ai-pulse 2s infinite linear;
}
</style>

<div class="nv-copilot-panel" ng-class="{'is-open': copilot.visible}">
    <div class="copilot-header">
        <h3><i class="fa fa-brain mr-2"></i> Threat Copilot <span class="badge badge-primary ml-2" ng-bind="copilot.modelProvider" style="font-size: 10px;text-transform: uppercase;"></span></h3>
        <div class="header-actions">
            <button class="btn-save-case" ng-if="copilot.context.caseId" ng-click="copilot.saveToCase()" ng-disabled="copilot.isSaving" uib-tooltip="Save Investigation to Case Tab">
                <i class="fa" ng-class="copilot.isSaving ? 'fa-spinner fa-spin' : 'fa-save'"></i> Save to Case
            </button>
            <button class="btn btn-sm btn-link text-muted" ng-click="copilot.close()"><i class="fa fa-times"></i></button>
        </div>
    </div>
    
    <div class="copilot-body" id="copilot-message-list">
        <div class="message-wrapper" ng-repeat="msg in copilot.messages" ng-class="'msg-' + msg.role">
            <div class="message-avatar">
                <i class="fa fa-user" ng-if="msg.role === 'user'"></i>
                <i class="fa fa-robot text-teal" ng-if="msg.role === 'assistant'"></i>
                <i class="fa fa-exclamation-triangle text-danger" ng-if="msg.role === 'system'"></i>
            </div>
                <div class="nv-msg-bubble">
                    <div class="nv-thoughts" ng-if="msg.thoughts && msg.thoughts.length > 0">
                        <div class="nv-thought" ng-repeat="thought in msg.thoughts track by $index">
                            <i class="fa fa-cog fa-spin" ng-if="$last && msg.isStreaming"></i>
                            <i class="fa fa-check text-success" ng-if="!($last && msg.isStreaming)"></i>
                            {{thought}}
                        </div>
                    </div>
                    <div style="white-space: pre-wrap; font-family: inherit; line-height: 1.5;">{{msg.content}}</div>
                </div>
        </div>
        
        <div class="loading-indicator text-teal mt-3" ng-if="copilot.loading">
            <i class="fa fa-circle-notch fa-spin"></i> Neural Engine analyzing MCP Tools...
        </div>
    </div>
    
    <div class="copilot-footer">
        <form ng-submit="copilot.sendMessage()">
            <div class="input-group">
                <input type="text" class="form-control" style="background:#374151; color:white; border:none;" ng-model="copilot.inputMessage" placeholder="Ask AI to investigate alerts or IPs..." ng-disabled="copilot.loading" autocomplete="off">
                <div class="input-group-append">
                    <button type="submit" class="btn btn-primary" ng-disabled="copilot.loading || !copilot.inputMessage.trim()">
                        <i class="fa fa-paper-plane"></i>
                    </button>
                </div>
            </div>
            <div class="model-selector mt-2 text-muted small d-flex align-items-center">
                <span class="mr-2">LLM Engine:</span> 
                <select ng-model="copilot.modelProvider" class="form-control form-control-sm" style="display:inline-block; width:100px; background:#1f2937; border:1px solid #374151; color:#9ca3af; margin-right:5px;">
                    <option value="ollama">Ollama</option>
                    <option value="moonshot">Moonshot</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="openai">OpenAI</option>
                    <option value="claude">Anthropic</option>
                    <option value="gemini">Gemini</option>
                </select>
                <select ng-model="copilot.modelName" ng-options="m for m in copilot.availableModels[copilot.modelProvider]" class="form-control form-control-sm" style="display:inline-block; width:140px; background:#1f2937; border:1px solid #374151; color:#9ca3af;">
                </select>
            </div>
        </form>
    </div>
</div>

<style>
.nv-copilot-panel {
    position: fixed;
    top: 55px;
    right: -420px;
    width: 420px;
    height: calc(100vh - 55px);
    background: #111827;
    border-left: 1px solid rgba(16, 185, 129, 0.3);
    box-shadow: -5px 0 25px rgba(0,0,0,0.8);
    z-index: 1050;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    font-family: inherit;
}
.nv-copilot-panel.is-open {
    right: 0;
}
.copilot-header {
    padding: 15px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1f2937;
}
.copilot-header h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: #10b981;
}
.copilot-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.message-wrapper {
    display: flex;
    gap: 12px;
    line-height: 1.5;
}
.msg-user { flex-direction: row-reverse; }
.msg-user .nv-msg-bubble {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.4);
    border-radius: 12px 12px 0 12px;
    color: #e5e7eb;
}
.msg-assistant .nv-msg-bubble {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px 12px 12px 0;
    color: #d1d5db;
}
.msg-system .nv-msg-bubble {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #ef4444;
}
.nv-msg-bubble {
    padding: 10px 14px;
    max-width: 85%;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
}
.message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #374151;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #9ca3af;
}
.copilot-footer {
    padding: 15px 20px;
    border-top: 1px solid rgba(255,255,255,0.05);
    background: #1f2937;
}
.text-teal { color: #10b981 !important; }
.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}
.btn-save-case {
    background: #10b981;
    color: white;
    border: none;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}
.btn-save-case:hover:not(:disabled) {
    background: #059669;
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
}
.btn-save-case:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
</style>

</div><!-- /ng-controller wrapper -->
